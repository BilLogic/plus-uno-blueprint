<svg viewBox="0 -40 880 548" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 11px; font-weight: 700; fill: #273036; }
    .chip { font-size: 10px; font-weight: 600; fill: #273036; }

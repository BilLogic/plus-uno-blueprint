    .rail { font-size: 9.5px; font-weight: 700; letter-spacing: .07em; fill: #8a8f98; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .twig { stroke: #d4d4da; stroke-width: 1; fill: none; }
    .halo { stroke: #fafbfc; stroke-width: 4; fill: none; }

    .lnMap   { stroke: #8ba3b6; stroke-width: 1; fill: none; }

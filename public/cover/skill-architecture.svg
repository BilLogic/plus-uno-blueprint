    .spSlice { stroke: #8fb39d; stroke-width: 1.4; fill: none; marker-end: url(#aSlice); }
    .lnAudit { stroke: #d29ab6; stroke-width: 1; fill: none; }
    .stAudit { stroke: #ecc9da; stroke-width: 1; fill: none; }
    .spAudit { stroke: #d29ab6; stroke-width: 1.4; fill: none; marker-end: url(#aAudit); }
    .lnWhat  { stroke: #9a95c6; stroke-width: 1; fill: none; }
    .stWhat  { stroke: #c8c5e2; stroke-width: 1; fill: none; }
    .spWhat  { stroke: #9a95c6; stroke-width: 1.4; fill: none; marker-end: url(#aWhat); }
  </style>

<svg viewBox="0 -44 880 334" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 11px; font-weight: 700; fill: #273036; }
    .chip { font-size: 10.5px; font-weight: 700; fill: #273036; }
    .sub { font-size: 9.5px; fill: #9ca3af; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .up { stroke: #b6bac2; stroke-width: 1.2; fill: none; marker-end: url(#triF); }
    .down { stroke: #b6bac2; stroke-width: 1.2; fill: none; marker-end: url(#triF); }
    .glyph { stroke: #9ca3af; stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="triF" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b6bac2"/>
    </marker>
  </defs>

  <rect x="0" y="-44" width="880" height="334" rx="14" fill="#fafbfc" stroke="#e2e4e9"/>

  <text x="16" y="-18" font-size="15" font-weight="700" fill="#273036">Ways into the blueprint</text>

  <!-- 1 · the app -->
  <g>
    <rect x="16" y="30" width="200" height="84" rx="10" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.3"/>
    <g opacity="0.8">
      <rect x="32" y="46" width="56" height="7" fill="#e8f3ed"/>
      <rect x="32" y="53" width="56" height="7" fill="#fdf1e3"/>
      <rect x="32" y="60" width="56" height="7" fill="#fbe9f0"/>
      <rect x="32" y="67" width="56" height="7" fill="#ecebf5"/>
      <rect x="32" y="46" width="56" height="28" fill="none" stroke="#d4d4da"/>
    </g>
    <text x="32" y="92" class="chip">the app</text>
    <text x="32" y="106" class="sub">read, compare, present</text>
  </g>

  <!-- 2 · the agent in the app -->
  <g>
    <rect x="232" y="30" width="200" height="84" rx="10" fill="#ffffff" stroke="#d4b483" stroke-width="1.3"/>
    <g opacity="0.8">
      <rect x="248" y="46" width="38" height="7" fill="#e8f3ed"/>
      <rect x="248" y="53" width="38" height="7" fill="#fdf1e3"/>
      <rect x="248" y="60" width="38" height="7" fill="#fbe9f0"/>
      <rect x="248" y="67" width="38" height="7" fill="#ecebf5"/>
      <rect x="248" y="46" width="38" height="28" fill="none" stroke="#d4d4da"/>
    </g>
    <rect x="292" y="46" width="22" height="28" rx="3" fill="#fdf1e3" stroke="#d4b483"/>
    <text x="248" y="92" class="chip">the in-app agent</text>
    <text x="248" y="106" class="sub">ask, and it drafts the change</text>
  </g>

  <!-- 3 · your agentic tools -->
  <g>
    <rect x="448" y="30" width="200" height="84" rx="10" fill="#ffffff" stroke="#d4b483" stroke-width="1.3"/>
    <text x="464" y="56" class="sub mono" font-size="9" fill="#8a8f98">&#8250;</text>
    <rect x="476" y="48" width="86" height="9" rx="3" fill="#eceef2"/>
    <rect x="464" y="66" width="120" height="6" rx="3" fill="#f4f5f7"/>
    <text x="464" y="92" class="chip">agentic tools</text>
    <text x="464" y="106" class="sub">map and audit from your IDE or CLI</text>
  </g>

  <!-- 4 · the chat bot -->
  <g>
    <rect x="664" y="30" width="200" height="84" rx="10" fill="#ffffff" stroke="#d4b483" stroke-width="1.3" stroke-dasharray="5 4"/>
    <path class="glyph" d="M680,44 h48 a5,5 0 0 1 5,5 v16 a5,5 0 0 1 -5,5 h-34 l-9,7 v-7 h-5 a5,5 0 0 1 -5,-5 v-16 a5,5 0 0 1 5,-5 z"/>
    <rect x="688" y="51" width="26" height="4" rx="2" fill="#eceef2"/>
    <rect x="688" y="59" width="34" height="4" rx="2" fill="#eceef2"/>
    <rect x="738" y="56" width="30" height="14" rx="7" fill="#fdf1e3" stroke="#d4b483"/>
    <path d="M746,63 h6 M752,60 l4,3 -4,3" fill="none" stroke="#d4b483" stroke-width="1.2"/>
    <text x="680" y="92" class="chip">the Slack bot</text>
    <text x="680" y="106" class="sub">answers, and links to the cell</text>
  </g>

  <!-- ways in and out of the blueprint -->
  <text x="99" y="162" class="sub" font-size="8" text-anchor="end" fill="#8a8f98">writes</text>
  <text x="133" y="162" class="sub" font-size="8" fill="#8a8f98">reads</text>
  <path class="down" d="M107,118 V196"/>
  <path class="up" d="M125,196 V120"/>
  <path class="down" d="M323,118 V196"/>
  <path class="up" d="M341,196 V120"/>
  <path class="down" d="M539,118 V196"/>
  <path class="up" d="M557,196 V120"/>
  <path class="up" d="M764,196 V120"/>

  <!-- the blueprint itself -->
  <rect x="16" y="200" width="848" height="60" rx="12" fill="#d9e4ea" stroke="#9aadbe" stroke-width="1.4"/>
  <text x="40" y="228" class="title" font-size="12">one shared context layer</text>
  <text x="40" y="244" class="sub" fill="#6b7280">maintained in one place, referenced from every surface</text>
  <g opacity="0.9">
    <rect x="772" y="212" width="68" height="36" fill="#ffffff" stroke="#9aadbe"/>
    <rect x="772" y="212" width="68" height="9" fill="#e8f3ed"/>
    <rect x="772" y="221" width="68" height="9" fill="#fdf1e3"/>
    <rect x="772" y="230" width="68" height="9" fill="#fbe9f0"/>
    <rect x="772" y="239" width="68" height="9" fill="#ecebf5"/>
  </g>
</svg>

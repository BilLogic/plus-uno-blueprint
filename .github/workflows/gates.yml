# The gates every change passes: types, lint, tests, and a build that runs.
#
# This workflow is late. Until it existed, `npm test` had never run in CI on
# this repo — 720 tests that only ran when somebody remembered, including
# seven in `blueprintContract.test.mjs` that had guarded the bot's read
# surface since August without a single automated run. The lint gate was
# blocked behind a 78-problem baseline for the same stretch; that baseline
# is now zero, so the gate can be a gate rather than an aspiration.
#
# `pull_request`, never `pull_request_target`: a fork's run gets a read-only
# token and no secrets, and it checks out untrusted code. `pull_request_target`
# runs in the base repo's context with secrets available, which combined with
# checking out the PR head hands an attacker this repo's token.
name: gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the top. A job needing more raises it for itself, so the
# escalation shows up in the diff.
permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The quarantine classifier is an ancestry question, and its unit
          # test asks it about three commits pinned by sha. A shallow clone
          # cannot answer, and that test refuses to pass when it cannot see —
          # so the history has to be here.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` honours the lockfile exactly. `npm install` would let a pull
      # request's package.json pull a version the lockfile never pinned — and
      # the agent's skill text arrives through that lockfile as a pinned git
      # dependency, so this is a correctness gate as well as a supply one.
      - run: npm ci

      # `tsc -b`, not a bare `tsc --noEmit`: tsconfig.json uses project
      # references, so a bare run typechecks nothing and exits 0.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # The vocabulary guards (#145, #146). Both are static and neither needs a
      # database, which is the only reason they can be required checks.
      #
      # `check:identifiers` runs the STATIC half only. Its live half sweeps
      # pg_catalog over a direct connection and stays out of CI on purpose —
      # this repository's standing rule is that a privileged database
      # credential never belongs in its workflows. `npm run
      # check:identifiers:live` is the manual counterpart, alongside
      # `check:contract:live`.
      #
      # The copy guard and the rename-map agreement test are vitest suites, so
      # `npm test` above already runs them; `npm run check:copy` exists for
      # running one on its own.
      - run: npm run check:identifiers
      - run: npm run check:database-names

      # The parse gate (#148). `supabase/migrations/` is not the apply path —
      # the schema went in over MCP `apply_migration` and the files were written
      # afterwards — so until this ran, no Postgres had ever read them. Three did
      # not parse. It needs no database either: `libpg-query` is the real parser
      # compiled to WebAssembly, so it is a required check like the two above.
      - run: npm run check:migration-syntax
      - run: npm run check:proof-footprint
      - run: npm run check:new-table-grants

      # The served-rulebook guard (#115). The canvas adapter is spliced into
      # every system prompt, and the pinned package's copy names a registry
      # this app does not have. This holds the instance override to
      # `WRITE_TOOL_NAMES` / `READ_TOOL_NAMES` and to the dependency-kind
      # constraint, and — the part that needs CI rather than a reviewer —
      # asserts loop.ts still serves the override, so a pin bump or a reverted
      # import line cannot silently reinstate the wrong rulebook.
      #
      # It reads `node_modules/agentic-service-blueprinting`, so it must run
      # after `npm ci`; it needs no database and no credential.
      - run: npm run check:write-surface

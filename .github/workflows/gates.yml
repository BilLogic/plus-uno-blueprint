# The gates every change passes: types, lint, tests, and a build that runs.
#
# This workflow is late. Until it existed, `npm test` had never run in CI on
# this repo — 720 tests that only ran when somebody remembered, including
# seven in `blueprintContract.test.mjs` that had guarded the bot's read
# surface since August without a single automated run. The lint gate was
# blocked behind a 78-problem baseline for the same stretch; that baseline
# is now zero, so the gate can be a gate rather than an aspiration.
#
# `pull_request`, never `pull_request_target`: a fork's run gets a read-only
# token and no secrets, and it checks out untrusted code. `pull_request_target`
# runs in the base repo's context with secrets available, which combined with
# checking out the PR head hands an attacker this repo's token.
name: gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the top. A job needing more raises it for itself, so the
# escalation shows up in the diff.
permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The quarantine classifier is an ancestry question, and its unit
          # test asks it about three commits pinned by sha. A shallow clone
          # cannot answer, and that test refuses to pass when it cannot see —
          # so the history has to be here.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` honours the lockfile exactly. `npm install` would let a pull
      # request's package.json pull a version the lockfile never pinned — and
      # the agent's skill text arrives through that lockfile as a pinned git
      # dependency, so this is a correctness gate as well as a supply one.
      - run: npm ci

      # `tsc -b`, not a bare `tsc --noEmit`: tsconfig.json uses project
      # references, so a bare run typechecks nothing and exits 0.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # The vocabulary guards (#145, #146). Both are static and neither needs a
      # database, which is the only reason they can be required checks.
      #
      # `check:identifiers` runs the STATIC half only. Its live half sweeps
      # pg_catalog over a direct connection and stays out of CI on purpose —
      # this repository's standing rule is that a privileged database
      # credential never belongs in its workflows. `npm run
      # check:identifiers:live` is the manual counterpart, alongside
      # `check:contract:live`.
      #
      # The copy guard and the rename-map agreement test are vitest suites, so
      # `npm test` above already runs them; `npm run check:copy` exists for
      # running one on its own.
      - run: npm run check:identifiers
      - run: npm run check:database-names

      # The value guard (#395). The two above sweep database OBJECTS — a table,
      # a column, a function. This one sweeps the VALUES a constrained column
      # accepts, which is a different axis and was unwatched: the ERD and the
      # agent's own tool specs went on teaching two lane roles the CHECK
      # constraint had stopped accepting, and nothing failed, because nothing
      # typechecks a value. Its vocabulary is derived from the migration series
      # rather than written down, so it is static and needs no database either.
      - run: npm run check:lane-role-values

      # The roster guard (#399), the mirror of the one above. That check fails
      # a value the constraint has RETIRED; this one fails a value it has
      # GAINED, by holding the two documents that state the WHOLE lane-role
      # vocabulary — the ERD's `%% Roles:` roster and the agent's own
      # `LANE_ROLE_FILTER_PARAM` — to the constraint by set EQUALITY rather
      # than containment. Containment one way is what let #395 happen;
      # containment the other way is what left a new role undocumented and
      # unfilterable. It reuses the same derived vocabulary, so it is static
      # and needs no database either.
      - run: npm run check:lane-role-roster

      # The router's three checks (#366). `AGENTS.md` is the whole always-loaded
      # tier — the one file every session is handed before it decides anything —
      # so the properties that keep it a router are held here rather than left
      # to a reviewer: it stays under a stated char budget that ratchets DOWN as
      # well as up, its prohibition count only falls, and every pointer in it
      # resolves, leads with its trigger word and carries a document at all.
      #
      # They sit in `gates` rather than in `docs-harness` because they gate the
      # file that binds every session's behaviour, including the sessions that
      # touch no doc; and they are cheap and static — three file reads, no
      # database, no network — so they can be required checks like the vocabulary
      # guards above.
      - run: npm run check:budget
      - run: npm run check:negation
      - run: npm run check:pointers

      # The glossary's own check (#365). `CONTEXT.md` is the first pointer the
      # router fires, so a session that reads `AGENTS.md` reads this next — and
      # for a year it was two thirds reference material: a rename map of some
      # two hundred lines and an interface-to-schema map of ninety, paid for by
      # every session that opened the file to look up one word. Both are gone,
      # to the check that enforces them and to a generated document under
      # `docs/`. This is what stops the file growing them back: headings, prose
      # and `**term** — definition` rows, with a failure for a code fence, for a
      # table naming a column, and for a section that defines no term. Static
      # and one file read, so it is a required check like the three above.
      - run: npm run check:glossary

      # The parse gate (#148). `supabase/migrations/` is not the apply path —
      # the schema went in over MCP `apply_migration` and the files were written
      # afterwards — so until this ran, no Postgres had ever read them. Three did
      # not parse. It needs no database either: `libpg-query` is the real parser
      # compiled to WebAssembly, so it is a required check like the two above.
      - run: npm run check:migration-syntax
      - run: npm run check:proof-footprint
      - run: npm run check:new-table-grants

      # The front door (#60). Unlike the other posture checks this one needs
      # NO privileged credential: GoTrue publishes its own configuration to
      # the anon key, and that key already ships inside the bundle this
      # repository deploys. So it reads repository VARIABLES rather than
      # secrets, which is the right home for a value that is public by design.
      #
      # The variables are named WITHOUT the `VITE_` prefix, and the script reads
      # them WITH it. That is not cosmetic: from the day this step was added
      # until #60 closed, every run printed "looked at nothing" and
      # `continue-on-error` swallowed it, so a gate that had never once
      # examined production read as a gate that was passing. The mapping is
      # explicit here rather than fixed by renaming the variables, because the
      # prefix means "the browser bundle inlines this" and nothing in Actions
      # is a browser bundle.
      #
      # `continue-on-error` is gone with #60, which is what its own note said
      # to do: sign-up is off, the check is green against production, and a
      # check that cannot fail the build is a comment.
      - run: npm run check:auth-posture
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      # The contract against the live database, on the ANON path.
      #
      # The note above says the live checks stay out of CI, and the reason it
      # gives is credentials — which is true of `check:identifiers:live`, whose
      # pg_catalog sweep needs a direct privileged connection. It is not true
      # of this one: as anon it reads exactly what the app's own browser bundle
      # reads, over the same repository VARIABLE the auth-posture step above
      # already uses. Lumping the two together left the contract's only live
      # guard running when somebody remembered.
      #
      # What it now also covers is the PROSE. On 2026-09-01 the docs that tell
      # an agent which columns to read were found naming seven that had not
      # existed since August. Prose does not 400, so a reviewer is the only
      # other thing that could have caught it, and a reviewer did not.
      #
      # This does reach production on every PR: ~30 anon reads, none of them
      # writes. A Supabase outage reddens the branch, which is the correct
      # trade — the alternative is a guard that reports agreement it never
      # checked. The service_role half stays manual, as the note above says.
      - run: npm run check:contract:live
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      # The agent-facing account renders its schema section from
      # pg_description on the same database, so it is held here, in the
      # same job, with the same key (#260).
      - run: npm run check:agent-account
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      # The served-rulebook guard (#115). The canvas adapter is spliced into
      # every system prompt, and the pinned package's copy names a registry
      # this app does not have. This holds the instance override to
      # `WRITE_TOOL_NAMES` / `READ_TOOL_NAMES` and to the dependency-kind
      # constraint, and — the part that needs CI rather than a reviewer —
      # asserts loop.ts still serves the override, so a pin bump or a reverted
      # import line cannot silently reinstate the wrong rulebook.
      #
      # It reads `node_modules/agentic-service-blueprinting`, so it must run
      # after `npm ci`; it needs no database and no credential.
      - run: npm run check:write-surface

      # The byte-identity drift gate (#319). `scripts/reconciled-files.mjs`
      # names the shared files this deployment has DECLARED byte-identical to
      # the pinned template; this fails the build if any of them has drifted
      # from asb's copy. It reads the same installed package
      # `node_modules/agentic-service-blueprinting` that check:write-surface
      # above does, so it belongs here in `gates`, after `npm ci`, and needs no
      # database. Unlike measure-template-divergence — which only REPORTS, over
      # a local `template` remote that CI never has — this gate stands on the
      # lockfile-pinned copy that `npm ci` guarantees is present. It lands EMPTY
      # (zero entries, a trivial pass); each reconciliation ticket enrols its
      # file with a one-line append to the allowlist.
      - run: npm run check:reconciled

      # The cross-repository duplicate sweep (#364, story 8). Its sibling above
      # asks whether two declared-identical files still agree byte for byte;
      # this asks the opposite question about the files that will never be
      # identical — whether a paragraph of this deployment's harness prose is
      # already stated in the template, in a document nothing holds together.
      #
      # `CONTEXT.md` is why the two cannot be one check. This glossary defines
      # forty-one terms and the template's defines twenty-six, so the two files
      # must differ permanently and can never join the reconciled allowlist —
      # yet a definition copied across and left unadapted sits inside them,
      # invisible to every byte comparison. The sweep normalises away line
      # wrapping, letter case, markdown syntax and each repository's own name
      # before it compares, which is what makes it a test of meaning rather
      # than of bytes.
      #
      # The spec put this check in `plus-uno`, and `scripts/check-harness.mjs`
      # there forbids it: a member that cannot run on a clean checkout makes
      # that gate permanently red, and no runner there has a second repository
      # on disk. It runs here because this is the only one of the three repos
      # that holds both harnesses at once — the template arrives through the
      # lockfile as `node_modules/agentic-service-blueprinting`. So, like the
      # two checks above, it belongs in `gates` after `npm ci`, needs no
      # database, no credential and no network, and can be a required check.
      - run: npm run check:duplicate-meaning

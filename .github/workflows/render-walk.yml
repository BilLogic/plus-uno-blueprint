# The one guard that opens this application in a browser.
#
# Every check in `gates` reads a file, a schema or a module graph. This builds
# the distribution with no database configured, previews it, and drives Chromium
# over every phase, scenario, path and layout the board offers, failing on a
# console error or a page error and filing one screenshot per view. The walk is
# the template's — `render-walk/` inside the pinned package, a published path,
# with its own runner since v1.44.10 — and `scripts/render-walk.mjs` is how this
# repository reaches it: one precondition, then that runner. The staging this
# repository used to do is the package's now, and that file says so at length.
#
# WHY ITS OWN WORKFLOW rather than a step in `gates`. It needs a browser and the
# system libraries around it, and it is minutes rather than seconds, so putting
# it in `gates` would make every typo wait for Chromium. Splitting it also means
# a red walk names itself in the checks table instead of hiding inside a job
# called typecheck · lint · test · build.
#
# `pull_request`, never `pull_request_target`, for the reason `gates.yml` gives:
# a fork's run gets a read-only token and no secrets, and it checks out
# untrusted code.
#
# NO CREDENTIAL IS NAMED HERE, and that is load-bearing rather than incidental.
# The walk is over a build made with the Supabase variables explicitly EMPTY:
# `isSupabaseConfigured()` reads `VITE_SUPABASE_URL` at build time and Vite bakes
# the value into `dist`, so a build with real values would have the walk
# measuring somebody's rows instead of a sample board. The walk refuses that run
# anyway — its first assertion is that the app shows its `sample data` badge —
# but the intent belongs where a reader sees it.
name: render-walk

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-walk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-walk:
    name: the board renders in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The browser, cached on the version that decides where it is looked for.
      # Playwright resolves its browsers by a build number tied to the package
      # version, so a key on the runner's OS alone would serve a Chromium the
      # installed Playwright will not use and the install below would download
      # another one on every run. The version comes from the LOCK file rather
      # than package.json: the lock is what `npm ci` installed.
      - name: The Playwright version this lock file installs
        run: |
          echo "PLAYWRIGHT_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" \
            >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      # Chromium only — one engine, because this walk is about whether the app
      # renders at all, not about engine differences. `--with-deps` is the
      # system libraries the runner lacks, and it runs apt on every run: the
      # cache saves the browser DOWNLOAD, not the dependency install.
      - run: npx playwright install --with-deps chromium

      # NO DATABASE, stated rather than merely left unset. This is the line that
      # decides which of the two worlds the walk measures, and it is the same
      # line the template's own job carries.
      - name: Build the distribution in no-database mode
        run: npm run build
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''

      # WHETHER THERE IS A BOARD TO WALK AT ALL, asked once and answered for the
      # two steps below.
      #
      # Both halves of the board are config fields since v1.44.10 —
      # `sample.nav` and `sample.blueprints` — and this deployment supplies
      # both. The content half is an EXPORT of its live board, taken through the
      # public read surface by `npm run export:sample-board` and committed, so a
      # no-database build draws the real thing and `walks` is true. Nothing here
      # runs that export and nothing here needs a credential for it: the file is
      # in the tree by the time this checkout happens.
      #
      # The question is still asked out loud rather than assumed. If the two
      # halves ever stop sharing an id — a bad export, a nav moved past it —
      # `check:render-walk` says so through the `unverified` register and exits
      # 0, the skip announced rather than swallowed, and the self-test below
      # cannot be asserted: an injected console error cannot fail a walk that
      # never opened a page. So it is skipped in that case and only in that
      # case, and nothing in this file has to change either way.
      - name: Is there a board this build serves with no database
        id: board
        run: |
          set -euo pipefail
          walks=$(node --input-type=module -e "
            import { servesASampleBoard } from './scripts/render-walk.mjs'
            process.stdout.write(servesASampleBoard(process.cwd()) ? 'true' : 'false')
          ")
          echo "walks=$walks" >> "$GITHUB_OUTPUT"
          echo "the build serves a board with no database: $walks"

      # The guard, watched failing, BEFORE it is trusted. A walk that reports no
      # console errors looks identical whether the app is clean or the listener
      # was never wired up — so one error is injected into every page and a zero
      # exit is the failure.
      # THE STORAGE PREFIX THE WALK WRITES UNDER IS THIS DEPLOYMENT'S, not the
      # template's. A spec that seeds settings — the phone agent jump seeds an
      # agent key — writes `<prefix>agent-settings`, and the app reads the
      # prefix `deployment/bootstrap.ts` configures. Left unset, the spec
      # defaults to the template's `sb-`, the app reads `uno-`, and the surface
      # under test never appears: the walk fails on a missing button rather
      # than on anything about the board. Read out of `bootstrap.ts` rather
      # than written twice, so a prefix change cannot desync the walk in
      # silence, and empty is a hard failure rather than a default.
      - name: The prefix the walk seeds under
        id: prefix
        run: |
          set -euo pipefail
          prefix=$(sed -n "s/.*configureStorageNamespace('\([^']*\)').*/\1/p" deployment/bootstrap.ts)
          if [ -z "$prefix" ]; then
            echo "could not read configureStorageNamespace from deployment/bootstrap.ts" >&2
            exit 1
          fi
          echo "value=$prefix" >> "$GITHUB_OUTPUT"
          echo "the walk seeds under \"$prefix\""

      - name: A console error fails the walk
        if: steps.board.outputs.walks == 'true'
        env:
          RENDER_WALK_STORAGE_PREFIX: ${{ steps.prefix.outputs.value }}
        run: |
          set -euo pipefail
          if RENDER_WALK_INJECT_CONSOLE_ERROR=1 npm run check:render-walk; then
            echo "FAIL: an injected console error did not fail the walk" >&2
            exit 1
          fi
          echo "ok: the walk refused a page that logged an error"

      # The walk itself. It runs unconditionally, because the skip is a
      # statement this job is supposed to carry: a run that prints what it could
      # not verify is the point of the `unverified` register, and gating this
      # step on the answer above would hide the sentence the register exists to
      # show.
      - name: Walk every view of the board, and drag an annotation
        env:
          RENDER_WALK_STORAGE_PREFIX: ${{ steps.prefix.outputs.value }}
        run: npm run check:render-walk

      # One screenshot per view, kept whichever way the walk went. The failures
      # this job CANNOT assert — a chip that lost its tint, a colour that is
      # wrong rather than absent — are read off these by a person, so they are
      # the deliverable of a green run as much as of a red one. `if: always()`
      # because a red walk is when they are read most, and it uploads whatever
      # the runs left behind, a failing run's trace included.
      #
      # `warn` rather than `error`: `if: always()` also runs this after a failed
      # build, and after a run that skipped, neither of which produces an output
      # directory at all. `error` there turns one real failure into two red
      # steps and points the reader at the upload rather than at the cause.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-walk-screenshots
          path: render-walk-output/**
          if-no-files-found: warn
